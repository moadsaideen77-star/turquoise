<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تركواز - لوحة الإدارة</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f8f8;
  color:#17282d;
  direction:rtl;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   COLORS
========================= */

:root{
  --primary:#168c7d;
  --primary-dark:#0f7065;
  --primary-light:#e7f8f5;
  --bg:#f4f8f8;
  --white:#ffffff;
  --text:#17282d;
  --muted:#8a9da1;
  --border:#e8eeee;
  --danger:#e05252;
  --warning:#e7a53c;
  --success:#21a77f;
  --shadow:0 5px 20px #0000000a;
}

/* =========================
   APP
========================= */

.app{
  min-height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  background:#ffffff;
  border-left:1px solid var(--border);
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  z-index:100;
  padding:20px 15px;
  overflow-y:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  margin-bottom:25px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  background:linear-gradient(135deg,#168c7d,#38b7a7);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 8px 20px #168c7d25;
}

.logo-text strong{
  display:block;
  font-size:18px;
  color:var(--text);
}

.logo-text small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.menu-title{
  font-size:10px;
  color:#a0adaf;
  margin:20px 12px 8px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu-item{
  border:0;
  background:transparent;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:13px;
  color:#637477;
  text-align:right;
  font-size:13px;
  transition:.2s;
}

.menu-item:hover{
  background:var(--primary-light);
  color:var(--primary);
}

.menu-item.active{
  background:var(--primary-light);
  color:var(--primary);
  font-weight:bold;
}

.menu-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.menu-item.active .menu-icon{
  background:#ffffff;
  box-shadow:0 3px 10px #00000008;
}

.menu-badge{
  margin-right:auto;
  background:#e7f8f5;
  color:var(--primary);
  padding:3px 7px;
  border-radius:10px;
  font-size:9px;
}

/* =========================
   MAIN
========================= */

.main{
  margin-right:260px;
  width:calc(100% - 260px);
  min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:78px;
  background:#ffffff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-title h1{
  font-size:21px;
  margin-bottom:5px;
}

.page-title p{
  color:var(--muted);
  font-size:11px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:#ffffff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 4px 12px #00000008;
  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 18px #00000012;
}

.admin-mini{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:5px;
  padding-right:10px;
  border-right:1px solid var(--border);
}

.admin-avatar{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,#168c7d,#54c8b8);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.admin-info strong{
  display:block;
  font-size:12px;
}

.admin-info small{
  display:block;
  color:var(--primary);
  font-size:9px;
  margin-top:4px;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:25px;
}

/* =========================
   STATS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.stat-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--primary-light);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.stat-change{
  font-size:9px;
  font-weight:bold;
  color:var(--success);
  background:#eaf9f3;
  padding:5px 8px;
  border-radius:12px;
}

.stat-card strong{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.stat-card small{
  color:var(--muted);
  font-size:10px;
}

/* =========================
   GRID
========================= */

.dashboard-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-bottom:20px;
}

.panel{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.panel-header h3{
  font-size:15px;
}

.panel-header span{
  color:var(--muted);
  font-size:10px;
}

.view-all{
  border:0;
  background:var(--primary-light);
  color:var(--primary);
  border-radius:10px;
  padding:7px 10px;
  font-size:10px;
}

/* =========================
   USERS
========================= */

.user-list{
  display:flex;
  flex-direction:column;
}

.user-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.user-item:last-child{
  border-bottom:0;
}

.user-avatar{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--primary-light);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}

.user-info{
  flex:1;
}

.user-info strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}

.user-info small{
  color:var(--muted);
  font-size:9px;
}

.user-level{
  background:#fff6df;
  color:#b27a16;
  padding:5px 8px;
  border-radius:12px;
  font-size:9px;
}

.user-status{
  width:8px;
  height:8px;
   border-radius:50%;
}

/* =========================
   RANKING
========================= */

.rank-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.rank-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:14px;
  background:#fafcfc;
}

.rank-number{
  width:28px;
  height:28px;
  border-radius:9px;
  background:var(--primary-light);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
}

.rank-avatar{
  width:36px;
  height:36px;
  border-radius:12px;
  background:#e9f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rank-info{
  flex:1;
}

.rank-info strong{
  display:block;
  font-size:11px;
  margin-bottom:3px;
}

.rank-info small{
  color:var(--muted);
  font-size:8px;
}

.rank-score{
  color:var(--primary);
  font-size:10px;
  font-weight:bold;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.quick-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
  text-decoration:none;
  color:var(--text);
  transition:.2s;
}

.quick-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px #000000.quick-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px #00000012;
}

.quick-card .quick-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#e8f8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin-bottom:10px;
}

.quick-card strong{
  display:block;
  font-size:13px;
  margin-bottom:4px;
}

.quick-card small{
  color:var(--muted);
  font-size:10px;
}


/* =========================
   STATISTICS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
}

.stat-card .stat-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#e8f8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  margin-bottom:10px;
}

.stat-card strong{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.stat-card span{
  color:var(--muted);
  font-size:10px;
}


/* =========================
   TABLE
========================= */

.table-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
  margin-bottom:  margin-bottom:20px;
}

.table-card h3{
  margin:0 0 15px;
  font-size:15px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

table th{
  padding:12px 10px;
  text-align:right;
  font-size:10px;
  color:var(--muted);
  background:#f8fbfb;
  border-bottom:1px solid #eef2f2;
}

table td{
  padding:13px 10px;
  font-size:11px;
  border-bottom:1px solid #f0f3f3;
  white-space:nowrap;
}

table tr:last-child td{
  border-bottom:0;
}

table tr:hover td{
  background:#fbfdfd;
}


/* =========================
   USER ROW
========================= */

.user-cell{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#e8f8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.user-info{
  flex:1;
}

.user-info strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}

.user-info small{
  color:var(--muted);
  font-size:9px;
}

.user-level{
  background:#fff6df;
  color:#b27a16;
  padding:5px 8px;
  border-radius:12px;
  font-size:9px;
}

.user-status{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  margin-left:5px;
}

.user-status.online{
  background:#22c55e;
}

.user-status.offline{
  background:#cbd5d1;
}


/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.badge-success{
  background:#e7f8f5;
  color:#168c7d;
}

.badge-warning{
  background:#fff6df;
  color:#b27a16;
}

.badge-danger{
  background:#ffe9e9;
  color:#c43b3b;
}

.badge-info{
  background:#eaf4ff;
  color:#2774b8;
}


/* =========================
   ACTION BUTTONS
========================= */

.action-btns{
  display:flex;
  align-items:center;
  gap:6px;
}

.small-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:10px;
  background:#f2f7f7;
  color:#168c7d;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:.2s;
}

.small-btn:hover{
  background:#168c7d;
  color:white;
}


/* =========================
   FORMS
========================= */

.form-card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
  border:1px solid #f0f4f4;
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:11px;
  font-weight:bold;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #e2e8e7;
  border-radius:12px;
  outline:none;
  font-family:inherit;
  font-size:11px;
  background:#fff;
  transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#168c7d;
  box-shadow:0 0 0 3px #168c7d12;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.primary-btn{
  border:0;
  background  background:#168c7d;
  color:white;
  padding:11px 18px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-size:11px;
  font-weight:bold;
  transition:.2s;
}

.primary-btn:hover{
  background:#117568;
  transform:translateY(-1px);
}

.secondary-btn{
  border:1px solid #dce7e5;
  background:white;
  color:#168c7d;
  padding:11px 18px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-size:11px;
  font-weight:bold;
  transition:.2s;
}

.secondary-btn:hover{
  background:#f2f8f7;
}


/* =========================
   ALERTS
========================= */

.alert{
  padding:12px 15px;
  border-radius:12px;
  margin-bottom:15px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:8px;
}

.alert-success{
  background:#e7f8f5;
  color:#168c7d;
}

.alert-warning{
  background:#fff6df;
  color:#b27a16;
}

.alert-danger{
  background:#ffe9e9;
  color:#c43b3b;
}

.alert-info{
  background:#eaf4ff;
  color:#2774b8;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#00000055;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:480px;
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px #00000020;
  animation:modalShow .2s ease;
}

@keyframes modalShow{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-header h3{
  margin:0;
  font-size:16px;
}

.modal-close{
  width:34px;
  height:34px;
  border:0;
  border-radius:10border-radius:10px;
background:#f2f5f5;
color:#666;
cursor:pointer;
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
}

.modal-close:hover{
  background:#ffe9e9;
  color:#c43b3b;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state{
  text-align:center;
  padding:35px 20px;
  color:var(--muted);
}

.empty-state .empty-icon{
  width:60px;
  height:60px;
  margin:0 auto 12px;
  border-radius:18px;
  background:#e8f8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.empty-state strong{
  display:block;
  color:var(--text);
  font-size:13px;
  margin-bottom:5px;
}

.empty-state p{
  margin:0;
  font-size:10px;
}


/* =========================
   LOADING
========================= */

.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.loading-spinner{
  width:30px;
  height:30px;
  border:3px solid #e2eeee;
  border-top-color:#168c7d;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .table-card{
    padding:14px;
  }

  .modal-box{
    padding:18px;
  }

  table{
    min-width:650px;
  }

}

@media(max-width:480px){

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .quick-actions{
    grid-template-columns:1fr 1fr;
  }

  .primary-btn,
  .secondary-btn{
    width:100%;
  }

}


/* =========================
   FINAL POLISH
========================= */

button,
input,
select,
textarea{
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:2px solid #168c7d;
  outline-offset:2px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  overflow-x:hidden;
}


/* =========================
   END OF STYLE
========================= */
