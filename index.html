<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تركواز | لوحة الإدارة</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#f4f7f9;
  color:#17212b;
}

header{
  background:#08a6a6;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.admin{
  background:rgba(255,255,255,.18);
  padding:10px 15px;
  border-radius:12px;
}

.container{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.welcome{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.welcome h1{
  margin-bottom:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card .icon{
  font-size:30px;
  margin-bottom:12px;
}

.card h3{
  color:#65727d;
  font-size:15px;
  margin-bottom:8px;
}

.number{
  font-size:28px;
  font-weight:bold;
}

.section-title{
  margin:25px 0 15px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.menu button{
  border:0;
  background:white;
  padding:22px;
  border-radius:18px;
  text-align:right;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  transition:.2s;
}

.menu button:hover{
  transform:translateY(-3px);
}

.menu span{
  display:block;
  font-size:28px;
  margin-bottom:12px;
}

footer{
  text-align:center;
  color:#7b8790;
  padding:30px 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🚕 تركواز</div>
  <div class="admin">👑 الإدارة الرئيسية</div>
</header>

<div class="container">

  <div class="welcome">
    <h1>مرحبًا بك في لوحة إدارة تركواز</h1>
    <p>من هنا يمكنك التحكم الكامل في منصة نقل الركاب.</p>
  </div>

  <div class="stats">

    <div class="card">
      <div class="icon">👥</div>
      <h3>إجمالي الركاب</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <div class="icon">🚕</div>
      <h3>السائقون</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <div class="icon">🛣️</div>
      <h3>الرحلات اليوم</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <div class="icon">💰</div>
      <h3>إيرادات اليوم</h3>
      <div class="number">$0</div>
    </div>

  </div>

  <h2 class="section-title">إدارة النظام</h2>

  <div class="menu">

    <button>
      <span>👥</span>
      إدارة الركاب
    </button>

    <button>
      <span>🚕</span>
      إدارة السائقين
    </button>

    <button>
      <span>🛣️</span>
      إدارة الرحلات
    </button>

    <button>
      <span>💰</span>
      المالية والأرباح
    </button>

    <button>
      <span>⚠️</span>
      الشكاوى والمشاكل
    </button>

    <button>
      <span>👑</span>
      مساعدو الإدارة والصلاحيات
    </button>

    <button>
      <span>📊</span>
      التقارير والإحصائيات
    </button>

    <button>
      <span>⚙️</span>
      إعدادات النظام
    </button>

  </div>

</div>

<footer>
  تركواز © 2026 — لوحة الإدارة الرئيسية
</footer>

</body>
</html>
