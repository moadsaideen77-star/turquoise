<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تركواز | لوحة الإدارة</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif
}

body{
  background:#f3f7f8;
  color:#17282d
}

button{
  font-family:inherit;
  cursor:pointer
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  width:250px;
  background:linear-gradient(180deg,#063f47,#062d34);
  color:white;
  padding:20px 15px;
  overflow:auto;
  z-index:10
}

.logo{
  text-align:center;
  padding:10px 0 20px;
  border-bottom:1px solid #ffffff18
}

.logo-icon{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:18px;
  background:linear-gradient(135deg,#1bcbbb,#087783);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px
}

.logo h1{
  margin-top:10px;
  font-size:25px
}

.logo small{
  color:#75e4db
}

.menu-title{
  color:#78b8bc;
  font-size:12px;
  margin:20px 10px 7px
}

.menu-item{
  display:flex;
  align-items:center;
  gap:12px;
  color:#d8eeee;
  text-decoration:none;
  padding:12px;
  margin:4px 0;
  border-radius:12px
}

.menu-item:hover,
.menu-item.active{
  background:#ffffff14;
  color:white
}

.menu-icon{
  width:25px;
  text-align:center;
  font-size:18px
}

.admin{
  margin-top:20px;
  padding:12px;
  border-radius:15px;
  background:#ffffff10;
  display:flex;
  align-items:center;
  gap:10px
}

.admin-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd96b,#a86e14);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px
}

.admin-name{
  font-size:13px;
  font-weight:bold
}

.admin-role{
  color:#ffd76a;
  font-size:10px;
  margin-top:4px
}

/* MAIN */
.main{
  margin-right:250px;
  padding:20px
}

.topbar{
  background:white;
  border-radius:17px;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 18px #00000008;
