<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تركواز - لوحة الإدارة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--primary:#168c7d;
--dark:#0f7065;
--light:#e7f8f5;
--bg:#f4f8f8;
--white:#fff;
--text:#17282d;
--muted:#8a9da1;
--border:#e8eeee;
--danger:#e05252;
--warning:#e7a53c;
--success:#21a77f
}

body{
font-family:Arial,Tahoma,sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh}

.sidebar{
width:260px;
background:#fff;
border-left:1px solid var(--border);
position:fixed;
top:0;
right:0;
bottom:0;
padding:20px 15px;
overflow-y:auto;
z-index:100
}

.logo{
display:flex;
align-items:center;
gap:12px;
padding:10px;
margin-bottom:25px
}

.logo-icon{
width:48px;
height:48px;
border-radius:16px;
background:linear-gradient(135deg,#168c7d,#38b7a7);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:24px
}

.logo-text strong{
display:block;
font-size:18px
}

.logo-text small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:4px
}

.menu-title{
font-size:10px;
color:#a0adaf;
margin:20px 12px 8px
}

.menu{
display:flex;
flex-direction:column;
gap:5px
}

.menu-item{
border:0;
background:transparent;
width:100%;
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:13px;
color:#637477;
text-align:right;
font-size:13px
}

.menu-item:hover,
.menu-item.active{
background:var(--light);
color:var(--primary)
}

.menu-item.active{font-weight:bold}

.menu-icon{
width:34px;
height:34px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:17px
}

.menu-badge{
margin-right:auto;
background:var(--light);
color:var(--primary);
padding:3px 7px;
border-radius:10px;
font-size:9px
}

.main{
margin-right:260px;
width:calc(100% - 260px);
min-height:100vh
}

.topbar{
height:78px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
position:sticky;
top:0;
z-index:50
}

.page-title h1{
font-size:21px;
margin-bottom:5px
}

.page-title p{
color:var(--muted);
font-size:11px
}

.top-actions{
display:flex;
align-items:center;
gap:10px
}

.icon-btn{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#fff;
color:var(--primary);
font-size:18px;
box-shadow:0 4px 12px #00000008
}

.admin-mini{
display:flex;
align-items:center;
gap:10px;
margin-right:5px;
padding-right:10px;
border-right:1px solid var(--border)
}

.admin-avatar{
width:42px;
height:42px;
border-radius:14px;
background:linear-gradient(135deg,#168c7d,#54c8b8);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:18px
}

.admin-info strong{
display:block;
font-size:12px
}

.admin-info small{
display:block;
color:var(--primary);
font-size:9px;
margin-top:4px
}

.content{padding:25px}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px
}

.stat-card,
.panel,
.table-card,
.form-card{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 5px 20px #0000000a;
border:1px solid #f0f4f4
}

.stat-top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.stat-icon,
.quick-icon{
width:44px;
height:44px;
border-radius:14px;
background:var(--light);
